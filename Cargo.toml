[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Paulo Alves <pauloalvsjr@gmail.com>"]

[workspace.dependencies]
dirstat-core = { path = "crates/dirstat-core" }
dirstat-treemap = { path = "crates/dirstat-treemap" }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "x11"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.16"
open = "5"
rayon = "1.12"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rustc-hash = "2.1"
memchr = "2.8"
blake3 = "1.8"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"
tempfile = "3.27"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
