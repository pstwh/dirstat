name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        id: check
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$crate" ]; then
            echo "::error::Tag $tag does not match the workspace version $crate in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, ci]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            name: x86_64-linux
          - os: windows-latest
            name: x86_64-windows
          - os: macos-latest
            name: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: System packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Build
        run: cargo build --release --locked -p dirstat-app
      - name: Smoke test
        shell: bash
        run: |
          binary=target/release/dirstat
          [ "${{ runner.os }}" = "Windows" ] && binary=target/release/dirstat.exe
          "$binary" --help
          file "$binary" || true
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="dirstat-v${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          case "${{ runner.os }}" in
            Linux)
              cp target/release/dirstat README.md "dist/$name/"
              cp -r packaging "dist/$name/"
              rm -f "dist/$name/packaging/Info.plist"
              cp crates/dirstat-app/assets/icon.png "dist/$name/packaging/dirstat.png"
              tar -C dist -czf "dist/$name.tar.gz" "$name"
              ;;
            Windows)
              cp target/release/dirstat.exe README.md "dist/$name/"
              (cd dist && 7z a "$name.zip" "$name" > /dev/null)
              ;;
            macOS)
              app="dist/$name/dirstat.app/Contents"
              mkdir -p "$app/MacOS" "$app/Resources"
              cp target/release/dirstat "$app/MacOS/"
              cp packaging/Info.plist "$app/Info.plist"
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION%%-*}" "$app/Info.plist"
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${VERSION}" "$app/Info.plist"
              iconset="$RUNNER_TEMP/dirstat.iconset"
              mkdir -p "$iconset"
              for size in 16 32 128 256; do
                sips -z $size $size crates/dirstat-app/assets/icon.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
                double=$((size * 2))
                sips -z $double $double crates/dirstat-app/assets/icon.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
              done
              iconutil -c icns "$iconset" -o "$app/Resources/dirstat.icns"
              /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string dirstat" "$app/Info.plist"
              codesign --force --deep --sign - "dist/$name/dirstat.app"
              codesign --verify --verbose "dist/$name/dirstat.app"
              cp README.md "dist/$name/"
              (cd dist && ditto -c -k --keepParent "$name" "$name.zip")
              ;;
          esac
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cd ..
          flags=(--title "$TAG" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* "${flags[@]}" --repo "$GITHUB_REPOSITORY"
          fi
